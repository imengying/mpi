[package]
name = "mpi"
version = "0.1.0"
edition = "2024"
description = "极简终端 AI 编程代理"
license = "MIT"

# The project keeps the name `mpi`, so the library and its `mpi::` paths are unchanged;
# what the user runs is `pi`. The binary is what every user-facing name follows — the
# release archive, the updater, the resume hint — so it is renamed here, once.
[[bin]]
name = "pi"
path = "src/main.rs"

[dependencies]
# `time` is for the working spinner: it advances the frame while a request or a command
# blocks, which is exactly when no other event arrives to redraw on.
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "sync", "signal", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "http2", "rustls", "charset"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
dirs = "7.0"
unicode-width = "0.2"
similar = "3.2"
uuid = { version = "1.26", features = ["v7"] }
# Clipboard image input. Pixels are re-encoded as PNG; a JPEG/TIFF stack is never
# on this path, so the encoder is `png` rather than `image`.
arboard = { version = "3.6", features = ["wayland-data-control"] }
# Already in the tree via reqwest; declared because the image path needs it directly.
base64 = "0.23"
png = "0.18"

[profile.release]
# Shipping profile in the shape fast CLIs use: full opts, thin LTO, one codegen
# unit, symbols stripped. opt-level 2 compiled faster but left a larger, slower
# binary. Fat LTO is skipped — it multiplies CI time across the four targets for
# a smaller gain, and `cargo test --release` builds this same profile.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
