[package]
name = "mpi"
version = "0.1.0"
edition = "2024"
description = "极简终端 AI 编程代理"
license = "MIT"

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "sync", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "http2", "rustls", "charset"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
dirs = "7.0"
unicode-width = "0.2"
similar = "3.2"
uuid = { version = "1.26", features = ["v7"] }

[profile.release]
opt-level = 2
