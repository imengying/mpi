name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  PI_TEST_REQUIRE_ENGINES: "1"

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: ./.github/actions/test-dependencies
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        id: tests
        run: |
          if cargo test --locked --no-fail-fast > "$RUNNER_TEMP/pi-tests.log" 2>&1; then
            cat "$RUNNER_TEMP/pi-tests.log"
            exit 0
          fi
          cat "$RUNNER_TEMP/pi-tests.log"
          # Keep assertion failures visible in the check summary as well as the full log.
          python3 - <<'PY'
          import os
          from pathlib import Path
          log = Path(os.environ["RUNNER_TEMP"], "pi-tests.log").read_text()
          start = log.find("failures:")
          message = (log[start:] if start >= 0 else log)[-12000:]
          for offset in range(0, len(message), 3000):
              part = message[offset:offset + 3000]
              part = part.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=Rust tests::" + part)
          PY
          exit 1
      - run: sh -n install.sh
      - if: success() || (failure() && steps.tests.outcome == 'failure')
        timeout-minutes: 2
        run: python3 tests/terminal_signals.py target/debug/pi
