name: release

# Pushing a tag is the release trigger, and the tag itself is the version: `v1.2.3`
# builds `pi-1.2.3-<target>`. Nothing else in the repo carries a version that has to be
# kept in sync.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # A release should not ship with warnings.
  RUSTFLAGS: "-D warnings"

jobs:
  # One job per target so a failure on one platform still publishes the others.
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # The tag *is* the version. This is set for the whole job rather than one step, because
    # `cargo test --release` also builds the binary: a step-scoped value would let that
    # rebuild it without the version, and the packaged binary would be the versionless one.
    env:
      # Without the leading `v`, so `--version`, the check below and the artifact names all
      # quote the same string. This is set for the whole job because `cargo test --release`
      # also builds the binary; a step-scoped value would let that rebuild it without the
      # version.
      PI_BUILD_VERSION: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built on the runner's own glibc, which is what the binary will require.
          # `ubuntu-latest`/`ubuntu-24.04` currently means glibc 2.39.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install test dependencies
        # The tools shell out to zsh, and the policy's allow-list names rg. The runners do
        # not ship both, and the tests assert on their real behaviour, so they have to be
        # there rather than skipped.
        if: matrix.os == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends zsh ripgrep
          which zsh; which rg
          zsh --version

      - name: Build
        # `build.rs` declares PI_BUILD_VERSION as a rerun trigger, so a cached build cannot
        # keep a stale value when the tag changes.
        run: |
          set -euo pipefail
          cargo build --release --locked --target ${{ matrix.target }}
          # Verify the version is the tag, so a mismatch fails here rather than shipping.
          REPORTED="$("target/${{ matrix.target }}/release/pi" --version | awk '{print $NF}')"
          test "$REPORTED" = "${GITHUB_REF_NAME#v}" || {
            echo "::error::binary reports ${REPORTED}, tag says ${GITHUB_REF_NAME#v}"
            exit 1
          }
          echo "binary reports pi ${REPORTED}"

      - name: Test
        # The host toolchain runs the tests; nothing here is target-specific.
        if: matrix.os == 'ubuntu-24.04'
        run: cargo test --release --locked

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          # The tag is the version, so the artifact names carry it.
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="pi-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/pi" "dist/$NAME/"
          cp README.md "dist/$NAME/"
          # The licence text travels with the binary that is published under it.
          cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["license"])' \
            > "dist/$NAME/LICENSE.txt"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          # No .sha256 alongside: GitHub computes checksums for release assets itself.
          ls -la dist

      - name: Report the glibc the Linux binary needs
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          # Record the floor in the run summary, so an unexpectedly high requirement is
          # visible instead of shipping silently.
          FLOOR="$(objdump -T target/x86_64-unknown-linux-gnu/release/pi \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          {
            echo "### glibc requirement"
            echo
            echo "Highest symbol version: \`${FLOOR:-unknown}\`"
            echo
            echo "Built on ubuntu-24.04, so the floor is the runner's own glibc."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pi-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The release notes are built from `git log` between tags, and the default shallow
      # clone has neither the history nor any tags, so both have to be fetched.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v8
        with:
          pattern: pi-*
          path: artifacts
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The tag is the version: the title is the tag itself (like pi), and the notes are
          # the commits since the previous tag.
          PREVIOUS="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREVIOUS" ]; then
            RANGE="${PREVIOUS}..${GITHUB_REF_NAME}"
          else
            RANGE="${GITHUB_REF_NAME}"
          fi
          {
            git log --no-decorate --pretty='- %s (%h)' "$RANGE"
          } > notes.md
          ls -la artifacts
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            artifacts/*.tar.gz
